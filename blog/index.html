        1. Duplica blog/template.html e renomeia (ex: blog/meu-artigo.html)

        3. Adiciona aqui um card .blog-card a apontar para o novo ficheiro, seguindo o exemplo comentado abaixo:

        <a class="blog-card" href="meu-artigo.html">
          <h3>Título do artigo</h3>
